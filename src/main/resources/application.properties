spring.application.name=careerflow-backend

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerflow_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=8080
# JWT: supply a Base64-encoded random key of at least 32 bytes through the environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=900
app.jwt.issuer=careerflow

# Resume uploads: service enforces a 5 MiB file limit.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Local resume analysis. No hosted API key is required.
app.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.ai.ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b}
app.ai.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
spring.config.import=optional:file:./config/local.properties
