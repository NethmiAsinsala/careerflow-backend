spring.application.name=careerflow-backend

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/careerflow_db
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=8080
# JWT: supply a Base64-encoded random key of at least 32 bytes through the environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=900
app.jwt.issuer=careerflow

# Resume uploads: service enforces a 5 MiB file limit.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
