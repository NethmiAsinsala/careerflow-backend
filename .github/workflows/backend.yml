name: Backend tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: careerflow_test
          MYSQL_ROOT_PASSWORD: test-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/careerflow_test
          DB_USERNAME: root
          DB_PASSWORD: test-only-password
          CAREERFLOW_DB_TESTS: 'true'
